<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>バーコードカロリーチェッカー</title>
  <script src="https://unpkg.com/@ericblade/quagga2/dist/quagga.min.js"></script>
  <style>
    #scanner { width: 100%; height: 300px; border: 1px solid gray; margin-top: 10px; }
    body { font-family: sans-serif; padding: 1em; background-color: #f9f9f9; }
    button { padding: 0.5em 1em; font-size: 1rem; margin-bottom: 1em; }
  </style>
</head>
<body>
  <h2>バーコードカロリーチェッカー📱</h2>
  <button onclick="startScanner()">バーコードをスキャン</button>
  <div id="scanner"></div>
  <div id="result"></div>

  <script>
    let scanned = false; // 一度だけ検出するためのフラグ

    function startScanner() {
      scanned = false; // 再スキャン時はリセット

      Quagga.init({
        inputStream: {
          name: "Live",
          type: "LiveStream",
          target: document.querySelector('#scanner'),
          constraints: {
            facingMode: "environment"  // 背面カメラを使用
          }
        },
        decoder: {
          readers: ["ean_reader", "ean_8_reader", "upc_reader", "code_128_reader"] // 精度UP
        }
      }, function (err) {
        if (err) {
          console.error(err);
          return;
        }
        Quagga.start();
      });

      Quagga.onDetected(async function (data) {
        if (scanned) return; // 一度検出したら無視
        scanned = true;

        const code = data.codeResult.code;
        document.getElementById("result").innerHTML = `バーコード: ${code}<br>検索中...`;

        try {
          const res = await fetch(`https://world.openfoodfacts.org/api/v0/product/${code}.json`);
          const json = await res.json();
          if (json.status === 1) {
            const product = json.product.product_name || "不明";
            const kcal = json.product.nutriments["energy-kcal_100g"] || "不明";
            document.getElementById("result").innerHTML = `✅ 商品名: ${product}<br>🔥 カロリー（100g）: ${kcal} kcal<br>JANコード: ${code}`;
          } else {
            document.getElementById("result").innerHTML = `商品が見つかりませんでした`;
          }
        } catch (e) {
          document.getElementById("result").innerHTML = `API呼び出しエラー: ${e}`;
        }

        Quagga.stop(); // 読み取り停止
      });
    }
  </script>
</body>
</html>
